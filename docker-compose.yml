name: renta

# Servicios base de desarrollo local (docs/engineering/06-DOCKER.md §3): Postgres, Redis,
# MinIO. Sin puertos publicados aqui a proposito (docker-compose.override.yml los agrega) -
# un entorno de CI con Testcontainers no los necesita fijos.

networks:
  renta-dev:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-renta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renta}
      POSTGRES_DB: ${POSTGRES_DB:-renta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - renta-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-renta} -d ${POSTGRES_DB:-renta}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks:
      - renta-dev
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio dejo de existir en Docker Hub/Quay: build de Chainguard del mismo binario,
    # fijado por digest (docs/persistence/10-DECISIONES.md #125). Incluye mc, por eso el
    # healthcheck de abajo sigue igual.
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-renta}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-renta1234}
    volumes:
      - minio-data:/data
    networks:
      - renta-dev
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Job de un solo uso: crea el bucket por defecto al arrancar por primera vez
  # (docs/engineering/06-DOCKER.md §3). Vuelve a correr en cada `up`, pero `--ignore-existing`
  # lo vuelve un no-op cuando el bucket ya existe.
  minio-init:
    # Misma imagen que el servicio minio: trae mc y sh. cgr.dev/chainguard/minio-client no
    # trae shell, y este job la necesita (#125).
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - renta-dev
    entrypoint: >
      /usr/bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-renta} ${STORAGE_SECRET_KEY:-renta1234} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-renta-dev}
      "
