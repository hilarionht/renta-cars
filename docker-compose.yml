name: renta

# Servicios base de desarrollo local (docs/engineering/06-DOCKER.md §3): Postgres, Redis,
# RustFS (S3 compatible, #143; reemplaza a MinIO, archivado). Sin puertos publicados aqui a proposito (docker-compose.override.yml los agrega) -
# un entorno de CI con Testcontainers no los necesita fijos.

networks:
  renta-dev:
    driver: bridge

volumes:
  postgres-data:
  rustfs-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-renta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renta}
      POSTGRES_DB: ${POSTGRES_DB:-renta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - renta-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-renta} -d ${POSTGRES_DB:-renta}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks:
      - renta-dev
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    # Imagen oficial, fijada por digest del indice multi-arquitectura (rustfs/rustfs:1.0.1, la
    # misma version que corre en local; docs/persistence/10-DECISIONES.md #143). Corre como
    # usuario no root y trae curl, que usan el healthcheck y el job rustfs-init.
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-renta}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-renta1234}
      RUSTFS_REGION: ${STORAGE_REGION:-us-east-1}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
    volumes:
      - rustfs-data:/data
    networks:
      - renta-dev
    healthcheck:
      # /health/ready responde cuando almacenamiento e IAM estan listos.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:9000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 10

  # Job de un solo uso: crea el bucket por defecto (docs/engineering/06-DOCKER.md §3). Sin mc:
  # el curl de la imagen firma el PUT con SigV4. Vuelve a correr en cada `up`; si el bucket ya
  # existe, RustFS responde 200 (o 409), y las dos cuentan como exito. La CORS para la web la
  # configura `npm run dev:storage-setup`.
  rustfs-init:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - renta-dev
    entrypoint:
      - /bin/sh
      - -c
      - >
        code=$$(curl -s -o /dev/null -w '%{http_code}'
        --aws-sigv4 'aws:amz:${STORAGE_REGION:-us-east-1}:s3'
        --user '${STORAGE_ACCESS_KEY:-renta}:${STORAGE_SECRET_KEY:-renta1234}'
        -X PUT http://rustfs:9000/${STORAGE_BUCKET:-renta-dev});
        echo "crear bucket: HTTP $$code";
        [ "$$code" = 200 ] || [ "$$code" = 409 ]
