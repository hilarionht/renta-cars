# docs/engineering/08-OBSERVABILITY-BOOTSTRAP.md §1: scrapea el exportador Prometheus del
# otel-collector (pull, no remote-write) - unica fuente de metricas del perfil de
# observabilidad en este bootstrap.

global:
  scrape_interval: 15s

# docs/persistence/10-DECISIONES.md #105: reglas de alerta estructurales, contraparte de los
# 3 dashboards ya provisionados - umbrales sin calibrar (Fase 6, docs/technical/
# 06-OBSERVABILITY.md §6).
rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
