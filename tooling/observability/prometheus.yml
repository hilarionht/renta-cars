# docs/engineering/08-OBSERVABILITY-BOOTSTRAP.md §1: scrapea el exportador Prometheus del
# otel-collector (pull, no remote-write) - unica fuente de metricas del perfil de
# observabilidad en este bootstrap.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
