name: PR

# docs/engineering/05-CI-CD.md §2: pipeline completo de PR contra master (rama principal
# de este repositorio - la documentacion usa "main" como nombre generico).

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_reusable-ci.yml
    secrets: inherit
    with:
      base: origin/master

  docker-validate:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build sin publicar - valida que la imagen construye, nunca se despliega desde un PR
      # (docs/engineering/05-CI-CD.md §2, docs/engineering/06-DOCKER.md §1).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      # #143: valida la sintaxis y la interpolacion de docker-compose (RustFS en lugar de MinIO);
      # --quiet solo informa errores.
      - name: docker compose config
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

  e2e:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://build:build@build:5432/build
      # api-e2e levanta apps/api real (docs/engineering/04-TESTING-FOUNDATION.md §5):
      # ConfigModule falla fail-fast sin STORAGE_*/JWT_*. .env de desarrollo, no secreto.
      - run: cp .env.example .env
      - run: npm run security:generate-jwt-keys >> .env
      # docs/persistence/10-DECISIONES.md #144: los e2e del API (Testcontainers con Postgres,
      # Redis y RustFS) corren aca, no en `ci / test`. Solo api-e2e (con su dependencia
      # api:build) y solo si esta afectado.
      - name: api-e2e (afectado)
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: npx nx affected --target=test --exclude='*,!api-e2e' --base=origin/master
      - run: npx playwright install --with-deps chromium
      # E2E en cada PR por defecto (docs/engineering/05-CI-CD.md §2) - el umbral para
      # moverlo a nightly-e2e.yml se decide en Fase 0 con datos reales, no aquí.
      - name: nx affected --target=e2e
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: npx nx affected --target=e2e --base=origin/master
      - name: Publicar trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/**/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  audit:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run ci:audit-gate
