name: Reusable CI (lint, test, build)

# docs/engineering/05-CI-CD.md §1: pasos comunes a pr.yml y main.yml — main.yml reinvoca
# este archivo en vez de duplicar lint/test/build.

on:
  workflow_call:
    inputs:
      base:
        description: 'Base de comparación para `nx affected` (SHA o ref).'
        required: true
        type: string
      head:
        description: 'Head de comparación para `nx affected` (vacío = working tree).'
        required: false
        type: string
        default: ''

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected necesita suficiente historia para calcular el diff contra la rama
          # base (docs/technical/10-DECISIONES.md #7).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # docs/engineering/02-DEVELOPER-EXPERIENCE.md §1 paso 3: npm ci no genera el cliente de
      # Prisma por si solo (sin postinstall a proposito, ver 06-DOCKER.md §1) - sin este paso,
      # cualquier target que compile apps/api (typecheck, build) falla con "Module '@prisma/
      # client' has no exported member 'PrismaClient'". prisma.config.ts exige DATABASE_URL
      # resoluble solo para cargar la config (generate no se conecta a ninguna base, mismo
      # placeholder que usa apps/api/Dockerfile en su etapa build).
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://build:build@build:5432/build
      - name: nx affected --target=lint,typecheck
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: npx nx affected --target=lint,typecheck --base=${{ inputs.base }} ${{ inputs.head != '' && format('--head={0}', inputs.head) || '' }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://build:build@build:5432/build
      # .env de desarrollo (no secreto) para los tests que leen configuracion. No hay .env en
      # CI (gitignored) ni secretos de proveedor configurados todavia (docs/engineering/
      # 05-CI-CD.md §5) - mismo par de pasos que el bootstrap local.
      - run: cp .env.example .env
      - run: npm run security:generate-jwt-keys >> .env
      # El target `test` cubre unitarios/aplicacion e integracion (Testcontainers). api-e2e
      # tambien se llama `test`, pero corre en el job `e2e` de pr.yml/main.yml
      # (docs/persistence/10-DECISIONES.md #144): asi ese check obligatorio prueba algo real.
      - name: nx affected --target=test (sin api-e2e)
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: npx nx affected --target=test --exclude=api-e2e --base=${{ inputs.base }} ${{ inputs.head != '' && format('--head={0}', inputs.head) || '' }}
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          # Cobertura por proyecto (jest.config.ts de cada libs/apps genera su propio
          # `coverage/` sin coverageDirectory raíz compartido) - docs/engineering/
          # 04-TESTING-FOUNDATION.md §7.
          path: '*/**/coverage'
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: [lint-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://build:build@build:5432/build
      - name: nx affected --target=build
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: npx nx affected --target=build --base=${{ inputs.base }} ${{ inputs.head != '' && format('--head={0}', inputs.head) || '' }}
